name: test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Scan repository secrets
        run: docker run --rm -v "$PWD:/repo:ro" zricethezav/gitleaks:v8.28.0 detect --source=/repo --no-banner --redact
      - uses: pnpm/action-setup@v4
        with:
          version: 12.0.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: test -s LICENSE
      - run: pnpm audit --audit-level high
      - run: pnpm -r test
      - run: pnpm -r build
      - run: pnpm --filter @vector-metis/server-sdk pack --dry-run
      - run: pnpm --filter @vector-metis/browser-sdk pack --dry-run
      - name: Install packed SDKs in a clean project
        run: |
          set -euo pipefail
          pack_dir="$(mktemp -d)"
          pnpm --filter @vector-metis/server-sdk pack --pack-destination "$pack_dir"
          pnpm --filter @vector-metis/browser-sdk pack --pack-destination "$pack_dir"
          smoke_dir="$(mktemp -d)"
          printf '{"name":"sdk-smoke","private":true,"type":"module"}\n' > "$smoke_dir/package.json"
          npm install --prefix "$smoke_dir" --ignore-scripts --no-audit --no-fund "$pack_dir"/vector-metis-server-sdk-*.tgz "$pack_dir"/vector-metis-browser-sdk-*.tgz
          cd "$smoke_dir"
          node --input-type=module -e 'await import("@vector-metis/server-sdk"); await import("@vector-metis/browser-sdk");'
      - run: git diff --check
