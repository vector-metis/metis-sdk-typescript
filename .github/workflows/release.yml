name: release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    if: github.ref_protected == true
    runs-on: ubuntu-latest
    environment: npm
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12.0.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          cache: pnpm
      - name: Upgrade npm for trusted publishing
        run: npm install --global npm@11.6.2
      - run: pnpm install --frozen-lockfile
      - run: pnpm -r test
      - run: pnpm -r build
      # GitHub checks out a tag in detached HEAD state. Publish only packages
      # changed by this tag so an unchanged package is never republished.
      - name: Publish changed packages
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          changed="$(git diff-tree --no-commit-id --name-only -r "$GITHUB_SHA^" "$GITHUB_SHA")"
          if printf '%s\n' "$changed" | grep -Eq '^(packages/server/|package.json|pnpm-lock.yaml|pnpm-workspace.yaml)'; then
            pnpm --filter @vector-metis/server-sdk publish --access public --provenance --no-git-checks
          fi
          if printf '%s\n' "$changed" | grep -Eq '^(packages/browser/|package.json|pnpm-lock.yaml|pnpm-workspace.yaml)'; then
            pnpm --filter @vector-metis/browser-sdk publish --access public --provenance --no-git-checks
          fi
